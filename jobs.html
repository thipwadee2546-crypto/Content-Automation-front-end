<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Status - FB AI Content Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 280px;
            --primary-color: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --bg-color: #f8fafc;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: #1e293b;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', sans-serif;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            background: white;
            border-right: 1px solid #e2e8f0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: var(--sidebar-width);
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.3s ease;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.mobile-active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }

        /* Navigation Items */
        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            margin: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #64748b;
            font-weight: 500;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .nav-item:hover {
            background: #f1f5f9;
            color: #334155;
        }

        .nav-item.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .nav-item i {
            width: 24px;
            margin-right: 12px;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Cards and Containers */
        .fb-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Status colors */
        .job-badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .job-badge-pending {
            background: #fef9c3;
            color: #a16207;
            border: 1px solid #fde047;
        }

        .job-badge-processing {
            background: #ffedd5;
            color: #c2410c;
            border: 1px solid #fdba74;
            animation: pulse 2s infinite;
        }

        .job-badge-ready {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .job-badge-published {
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #93c5fd;
        }

        .job-badge-failed {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status-filter-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            background: #e5e7eb;
            color: #374151;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .status-filter-tab:hover {
            background: #d1d5db;
        }

        .status-filter-tab.active {
            background: #667eea;
            color: white;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Logo -->
        <div class="p-6 border-b border-gray-100 flex items-center justify-center">
            <div
                class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white mr-3 shadow-lg shadow-indigo-200">
                <i class="fab fa-facebook-f text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">AI Manager</h1>
                <p class="text-xs text-slate-400">Content Automation</p>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="mt-8 px-4 space-y-2 flex-1 overflow-y-auto">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="calendar.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Calendar</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Content</div>
            <a href="content.html" class="nav-item">
                <i class="fas fa-magic"></i>
                <span>Create Content</span>
            </a>
            <a href="post.html" class="nav-item">
                <i class="fas fa-paper-plane"></i>
                <span>Post Content</span>
            </a>
            <a href="jobs.html" class="nav-item active" id="nav-jobs" style="display: none;">
                <i class="fas fa-stream"></i>
                <span>Job Status</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider" id="nav-admin-header"
                style="display: none;">
                Admin</div>
            <a href="pages.html" class="nav-item">
                <i class="fas fa-flag"></i>
                <span>Pages</span>
            </a>
            <a href="users.html" class="nav-item" id="nav-users" style="display: none;">
                <i class="fas fa-users-cog"></i>
                <span>Users</span>
            </a>
            <a href="categories.html" class="nav-item" id="nav-categories" style="display: none;">
                <i class="fas fa-tags"></i>
                <span>Categories</span>
            </a>
        </nav>

        <!-- Divider -->
        <div class="w-full p-4 border-t border-gray-100 bg-gray-50/50 backdrop-blur-sm shrink-0">
            <button onclick="logout()"
                class="flex items-center w-full px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-colors font-medium">
                <i class="fas fa-sign-out-alt w-6"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header Bar -->
        <div
            class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-8 py-4 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-slate-800" id="pageTitle">Job Status</h2>
                <p class="text-sm text-slate-500">Monitor your content pipeline</p>
            </div>
            <div class="flex items-center gap-4">
                <button
                    class="w-10 h-10 rounded-full bg-white border border-gray-200 text-gray-500 hover:text-indigo-600 hover:border-indigo-200 flex items-center justify-center transition-all shadow-sm">
                    <i class="far fa-bell"></i>
                </button>
                <div class="user-profile flex items-center gap-3 pl-2 pr-4 py-1.5 bg-white border border-gray-200 rounded-full hover:border-indigo-300 transition-all cursor-pointer shadow-sm"
                    onclick="window.location.href='profile.html'">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm"
                        id="userInitial">A</div>
                    <div class="hidden md:block">
                        <p class="text-sm font-bold text-slate-700 leading-tight" id="userDisplay">User</p>
                        <p class="text-[10px] text-slate-400 uppercase font-bold" id="userRole" style="opacity: 0;"></p>
                    </div>
                    <i class="fas fa-chevron-down text-gray-300 text-xs ml-2"></i>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="p-8">
            <div id="jobs" class="block">
                <div class="fb-card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">ไปป์ไลน์โพสต์</h3>
                            <p class="text-gray-600 text-sm" id="jobsSubtitle">ดูสถานะของโพสต์ทั้งหมด</p>
                        </div>
                        <button onclick="refreshJobsList()"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-600">
                            <i class="fas fa-sync mr-2"></i>รีเฟรช
                        </button>
                    </div>

                    <!-- Admin Action Bar -->
                    <div id="adminActionBar" class="mb-4 p-3 bg-indigo-50 rounded-xl flex items-center gap-3 flex-wrap"
                        style="display:none">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-700">
                            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)"
                                class="w-4 h-4 rounded">
                            เลือกทั้งหมด
                        </label>
                        <span class="text-sm text-gray-400" id="selectedCount">0 รายการ</span>
                        <div class="flex-1"></div>
                        <button onclick="bulkApprove()"
                            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                            <i class="fas fa-check mr-1"></i>Approve
                        </button>
                        <button onclick="bulkReject()"
                            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                            <i class="fas fa-times mr-1"></i>Reject
                        </button>
                    </div>

                    <!-- Page Filter Dropdown -->
                    <div class="mb-4">
                        <label class="text-sm font-600 text-gray-700 block mb-2">เลือกเพจที่จะแสดง</label>
                        <select id="jobsPageFilter" onchange="setJobsPageFilter(this.value)"
                            class="border rounded px-3 py-2 w-full md:w-64 bg-white">
                            <option value="">-- ดูทั้งหมด --</option>
                        </select>
                    </div>

                    <!-- Status Filter Tabs -->
                    <div class="flex gap-2 mb-4 flex-wrap">
                        <button onclick="setJobsFilter('all')" class="status-filter-tab active" data-filter="all">
                            ทั้งหมด
                        </button>
                        <button onclick="setJobsFilter('pending')" class="status-filter-tab" data-filter="pending">
                            ⏳ รออนุมัติ
                        </button>
                        <button onclick="setJobsFilter('approved')" class="status-filter-tab" data-filter="approved">
                            ✅ อนุมัติแล้ว
                        </button>
                        <button onclick="setJobsFilter('published')" class="status-filter-tab" data-filter="published">
                            📤 Published
                        </button>
                        <button onclick="setJobsFilter('rejected')" class="status-filter-tab" data-filter="rejected">
                            🚫 Rejected
                        </button>
                        <button onclick="setJobsFilter('failed')" class="status-filter-tab" data-filter="failed">
                            ❌ Failed
                        </button>
                    </div>

                    <!-- Jobs List -->
                    <div id="jobsList" class="space-y-3">
                        <p class="text-gray-500 text-center py-4">กำลังโหลด...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center"
        style="display:none">
        <div class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-lg max-h-[85vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">แก้ไขโพสต์</h3>
                <button onclick="closeEditModal()"
                    class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times"></i></button>
            </div>
            <input type="hidden" id="editPostId">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm font-semibold text-gray-600 block mb-1">ชื่อสินค้า / Topic</label>
                        <input type="text" id="editProductName"
                            class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-600 block mb-1">ประเภท</label>
                        <select id="editCategory" class="w-full border rounded-xl p-3 text-sm">
                            <option value="">-- ไม่ระบุ --</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Caption</label>
                    <textarea id="editCaption" rows="5"
                        class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none"></textarea>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Media URL</label>
                    <input type="text" id="editMediaUrl"
                        class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm font-semibold text-gray-600 block mb-1">ประเภทสื่อ</label>
                        <select id="editMediaType" class="w-full border rounded-xl p-3 text-sm">
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="text">Text Only</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-600 block mb-1">นัดโพสต์</label>
                        <input type="datetime-local" id="editScheduledTime"
                            class="w-full border rounded-xl p-3 text-sm">
                    </div>
                </div>
                <button onclick="saveEdit()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors">
                    <i class="fas fa-save mr-2"></i>บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[200] space-y-2"></div>

    <script src="config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;
        let cachedJobs = [];
        let currentJobsFilter = 'all';
        let currentJobsPageFilter = '';
        let currentUserRole = 'user';
        let selectedPostIds = new Set();

        // Toast utility
        const Toast = {
            show(msg, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-500' };
                const el = document.createElement('div');
                el.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition-opacity duration-300`;
                el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'}"></i>${msg}`;
                container.appendChild(el);
                setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, duration);
            }
        };

        function getToken() { return localStorage.getItem('access_token'); }
        function isLoggedIn() { return !!getToken(); }

        function logout() {
            if (confirm('คุณต้องการออกจากระบบหรือไม่?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            }
        }

        function showAdminOnlyLinks() {
            const navJobs = document.getElementById('nav-jobs');
            const navUsers = document.getElementById('nav-users');
            const navAdminHeader = document.getElementById('nav-admin-header');
            const navCategories = document.getElementById('nav-categories');
            if (navJobs) navJobs.style.display = '';
            if (navUsers) navUsers.style.display = '';
            if (navAdminHeader) navAdminHeader.style.display = '';
            if (navCategories) navCategories.style.display = '';
        }

        async function loadUserInfo() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!response.ok) throw new Error('Unauthorized');
                const user = await response.json();
                document.getElementById('userDisplay').textContent = user.username;
                document.getElementById('userInitial').textContent = user.username.charAt(0).toUpperCase();

                const roleEl = document.getElementById('userRole');
                if (roleEl) {
                    roleEl.textContent = user.role === 'admin' ? 'Admin' : 'User';
                    roleEl.style.opacity = '1';
                    roleEl.style.transition = 'opacity 0.3s ease-in';
                }

                if (user.role === 'admin') {
                    showAdminOnlyLinks();
                    currentUserRole = 'admin';
                    document.getElementById('adminActionBar').style.display = '';
                    document.getElementById('jobsSubtitle').textContent = 'อนุมัติ แก้ไข และจัดการโพสต์ทั้งหมด (Admin)';
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
                logout();
            }
        }

        // ========================
        // JOBS LIST
        // ========================
        async function loadJobsList() {
            try {
                const response = await fetch(`${API_BASE}/jobs/status-posts`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!response.ok) throw new Error('Failed to load jobs');
                cachedJobs = await response.json();
                updateJobsPageFilterDropdown();
                renderJobsList();
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsList').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดสถานะงานได้</p>';
            }
        }

        function renderJobsList() {
            const jobsList = document.getElementById('jobsList');
            let jobs = cachedJobs;

            if (currentJobsFilter !== 'all') {
                jobs = jobs.filter(j => j.Status_Posts === currentJobsFilter);
            }
            if (currentJobsPageFilter) {
                jobs = jobs.filter(j => j.Page_Name === currentJobsPageFilter);
            }

            if (jobs.length === 0) {
                jobsList.innerHTML = '<p class="text-gray-500 text-center py-4">ไม่มีโพสต์ในหมวดนี้</p>';
                return;
            }

            const badgeMap = {
                pending: 'job-badge-pending',
                approved: 'job-badge-ready',
                publishing: 'job-badge-processing',
                published: 'job-badge-published',
                rejected: 'job-badge-failed',
                failed: 'job-badge-failed'
            };

            const statusLabel = {
                pending: 'รออนุมัติ',
                approved: 'อนุมัติแล้ว',
                publishing: 'กำลังโพสต์',
                published: 'โพสต์แล้ว',
                rejected: 'ไม่อนุมัติ',
                failed: 'ล้มเหลว'
            };

            jobsList.innerHTML = jobs.map(job => {
                const badgeClass = badgeMap[job.Status_Posts] || 'job-badge-pending';
                const label = statusLabel[job.Status_Posts] || job.Status_Posts;

                const scheduledText = job.Scheduled
                    ? new Date(job.Scheduled).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : 'ไม่ได้ตั้งเวลา';

                const createdText = job.Created_At
                    ? new Date(job.Created_At).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : '-';

                let thumbHtml = '';
                if (job.Media_URL) {
                    if (job.Media === 'video') {
                        thumbHtml = `<div class="w-16 h-16 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0 overflow-hidden">
                            <video src="${job.Media_URL}" class="w-full h-full object-cover"></video>
                        </div>`;
                    } else {
                        thumbHtml = `<img src="${job.Media_URL}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0 bg-gray-100" onerror="this.style.display='none'">`;
                    }
                } else {
                    thumbHtml = `<div class="w-16 h-16 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0 text-gray-400">
                        <i class="fas fa-image text-xl"></i>
                    </div>`;
                }

                const captionPreview = job.Caption
                    ? (job.Caption.length > 80 ? job.Caption.substring(0, 80) + '...' : job.Caption)
                    : '-';

                const categoryBadge = job.Category
                    ? `<span class="inline-block text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full ml-1">${job.Category}</span>`
                    : '';

                // Checkbox for admin (only pending/approved/rejected can be selected)
                const canSelect = currentUserRole === 'admin' && ['pending', 'approved'].includes(job.Status_Posts);
                const checkboxHtml = canSelect
                    ? `<input type="checkbox" class="job-checkbox w-4 h-4 rounded mt-1 flex-shrink-0" data-pid="${job.PID}" onchange="updateSelectedCount()" ${selectedPostIds.has(job.PID) ? 'checked' : ''}>`
                    : '';

                // Edit button for admin (only non-published)
                const editBtnHtml = currentUserRole === 'admin' && job.Status_Posts !== 'published'
                    ? `<button onclick="openEditModal(${job.PID})" class="text-indigo-500 hover:text-indigo-700 text-xs font-semibold transition-colors"><i class="fas fa-edit mr-1"></i>แก้ไข</button>`
                    : '';

                return `
                    <div class="bg-white border rounded-lg p-4">
                        <div class="flex gap-3">
                            ${checkboxHtml}
                            ${thumbHtml}
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-1">
                                    <div>
                                        <h4 class="font-bold text-gray-800">${job.Product || '-'}${categoryBadge}</h4>
                                        <p class="text-sm text-gray-500">เพจ: ${job.Page_Name || '-'}</p>
                                    </div>
                                    <div class="flex items-center gap-2 flex-shrink-0">
                                        ${editBtnHtml}
                                        <span class="job-badge ${badgeClass}">${label}</span>
                                    </div>
                                </div>
                                <p class="text-sm text-gray-700 mb-2 truncate">${captionPreview}</p>
                                <div class="text-xs text-gray-500 flex gap-4 flex-wrap">
                                    <span><i class="fas fa-calendar-alt mr-1 text-indigo-400"></i>${scheduledText}</span>
                                    <span><i class="far fa-clock mr-1 text-gray-400"></i>${createdText}</span>
                                    <span><i class="fas fa-photo-video mr-1 text-gray-400"></i>${job.Media || '-'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateJobsPageFilterDropdown() {
            const pageNames = [...new Set(cachedJobs.map(j => j.Page_Name).filter(Boolean))];
            const select = document.getElementById('jobsPageFilter');
            select.innerHTML = '<option value="">-- ดูทั้งหมด --</option>' +
                pageNames.map(name => `<option value="${name}">${name}</option>`).join('');
            select.value = currentJobsPageFilter;
        }

        function setJobsFilter(filter) {
            currentJobsFilter = filter;
            selectedPostIds.clear();
            document.querySelectorAll('.status-filter-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderJobsList();
            updateSelectedCount();
        }

        function setJobsPageFilter(pageName) {
            currentJobsPageFilter = pageName;
            renderJobsList();
        }

        function refreshJobsList() { loadJobsList(); }

        // ========================
        // SELECTION & APPROVE/REJECT
        // ========================
        function toggleSelectAll(checked) {
            document.querySelectorAll('.job-checkbox').forEach(cb => {
                cb.checked = checked;
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            selectedPostIds.clear();
            document.querySelectorAll('.job-checkbox:checked').forEach(cb => {
                selectedPostIds.add(parseInt(cb.dataset.pid));
            });
            document.getElementById('selectedCount').textContent = `${selectedPostIds.size} รายการ`;
            document.getElementById('selectAllCheckbox').checked =
                document.querySelectorAll('.job-checkbox').length > 0 &&
                document.querySelectorAll('.job-checkbox').length === document.querySelectorAll('.job-checkbox:checked').length;
        }

        async function bulkApprove() {
            if (selectedPostIds.size === 0) { Toast.show('กรุณาเลือกโพสต์ก่อน', 'warning'); return; }
            try {
                const res = await fetch(`${API_BASE}/posts/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify([...selectedPostIds])
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                const data = await res.json();
                Toast.show(`อนุมัติแล้ว ${data.approved_count} โพสต์`, 'success');
                selectedPostIds.clear();
                loadJobsList();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        async function bulkReject() {
            if (selectedPostIds.size === 0) { Toast.show('กรุณาเลือกโพสต์ก่อน', 'warning'); return; }
            if (!confirm(`ไม่อนุมัติ ${selectedPostIds.size} โพสต์?`)) return;
            try {
                const res = await fetch(`${API_BASE}/posts/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify([...selectedPostIds])
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                const data = await res.json();
                Toast.show(`ไม่อนุมัติ ${data.rejected_count} โพสต์`, 'success');
                selectedPostIds.clear();
                loadJobsList();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        // ========================
        // EDIT MODAL
        // ========================
        function openEditModal(pid) {
            const job = cachedJobs.find(j => j.PID === pid);
            if (!job) return;
            document.getElementById('editPostId').value = pid;
            document.getElementById('editProductName').value = job.Product || '';
            document.getElementById('editCaption').value = job.Caption || '';
            document.getElementById('editMediaUrl').value = job.Media_URL || '';
            document.getElementById('editMediaType').value = job.Media || 'image';
            document.getElementById('editCategory').value = job.Category_ID || '';
            if (job.Scheduled) {
                const d = new Date(job.Scheduled);
                const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                document.getElementById('editScheduledTime').value = local;
            } else {
                document.getElementById('editScheduledTime').value = '';
            }
            document.getElementById('editModal').style.display = '';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEdit() {
            const pid = document.getElementById('editPostId').value;
            const catVal = document.getElementById('editCategory').value;
            const body = {
                caption: document.getElementById('editCaption').value,
                media_url: document.getElementById('editMediaUrl').value,
                media_type: document.getElementById('editMediaType').value,
                scheduled_time: document.getElementById('editScheduledTime').value || null,
                product_name: document.getElementById('editProductName').value || null,
                category_id: catVal ? parseInt(catVal) : null
            };
            try {
                const res = await fetch(`${API_BASE}/posts/${pid}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                Toast.show('แก้ไขโพสต์สำเร็จ!', 'success');
                closeEditModal();
                loadJobsList();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) return;
                const cats = await res.json();
                const select = document.getElementById('editCategory');
                select.innerHTML = '<option value="">-- ไม่ระบุ --</option>' +
                    cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (e) { console.error('Failed to load categories:', e); }
        }

        // ========================
        // INIT
        // ========================
        async function checkAuth() {
            if (!isLoggedIn()) {
                window.location.href = 'index.html';
            } else {
                await loadUserInfo();
                loadCategories();
                loadJobsList();
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>

</html>
