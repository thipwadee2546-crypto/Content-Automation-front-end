<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - AI Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; z-index: 40; }
        .main-content { margin-left: 280px; min-height: 100vh; background: #f8fafc; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; color: #64748b; transition: all 0.2s; text-decoration: none; font-size: 0.925rem; }
        .nav-item:hover { background: #f1f5f9; color: #334155; }
        .nav-item.active { background: #eef2ff; color: #4f46e5; font-weight: 600; }
        .fb-card { background: white; border-radius: 16px; border: 1px solid #e5e7eb; }
    </style>
</head>

<body class="bg-gray-50">
    <div class="sidebar">
        <div class="p-6 border-b border-gray-100 flex items-center justify-center">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white mr-3 shadow-lg shadow-indigo-200">
                <i class="fab fa-facebook-f text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">AI Manager</h1>
                <p class="text-xs text-slate-400">Content Automation</p>
            </div>
        </div>

        <nav class="mt-8 px-4 space-y-2">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="calendar.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Calendar</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Content</div>
            <a href="content.html" class="nav-item">
                <i class="fas fa-magic"></i>
                <span>Create Content</span>
            </a>
            <a href="post.html" class="nav-item">
                <i class="fas fa-paper-plane"></i>
                <span>Post Content</span>
            </a>
            <a href="jobs.html" class="nav-item" id="nav-jobs" style="display: none;">
                <i class="fas fa-stream"></i>
                <span>Job Status</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-bold text-slate-400 uppercase tracking-wider" id="nav-admin-header" style="display: none;">Admin</div>
            <a href="pages.html" class="nav-item">
                <i class="fas fa-flag"></i>
                <span>Pages</span>
            </a>
            <a href="users.html" class="nav-item" id="nav-users" style="display: none;">
                <i class="fas fa-users-cog"></i>
                <span>Users</span>
            </a>
            <a href="categories.html" class="nav-item active" id="nav-categories" style="display: none;">
                <i class="fas fa-tags"></i>
                <span>Categories</span>
            </a>
        </nav>

        <div class="absolute bottom-0 w-full p-4 border-t border-gray-100 bg-gray-50/50 backdrop-blur-sm">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="logout()">
                <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center text-sm font-bold" id="userInitial">?</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-600 text-gray-700 truncate" id="userDisplay">Loading...</p>
                    <p class="text-xs text-gray-400" id="userRole" style="opacity: 0;">User</p>
                </div>
                <i class="fas fa-chevron-down text-gray-300 text-xs ml-2"></i>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="p-8">
            <div class="fb-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-lg font-bold text-gray-800"><i class="fas fa-tags text-indigo-500 mr-2"></i>จัดการประเภทโพสต์</h3>
                        <p class="text-gray-600 text-sm">เพิ่ม แก้ไข และลบประเภทโพสต์ (Admin only)</p>
                    </div>
                </div>

                <!-- Add Category -->
                <div class="flex gap-3 mb-6">
                    <input type="text" id="newCategoryName" placeholder="ชื่อประเภทใหม่..."
                        class="flex-1 px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all outline-none">
                    <button onclick="addCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-bold text-sm transition-colors">
                        <i class="fas fa-plus mr-2"></i>เพิ่ม
                    </button>
                </div>

                <!-- Category List -->
                <div id="categoryList" class="space-y-2">
                    <p class="text-gray-500 text-center py-4">กำลังโหลด...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[200] space-y-2"></div>

    <script src="config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        const Toast = {
            show(msg, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-500' };
                const el = document.createElement('div');
                el.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition-opacity duration-300`;
                el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'}"></i>${msg}`;
                container.appendChild(el);
                setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, duration);
            }
        };

        function getToken() { return localStorage.getItem('access_token'); }
        function isLoggedIn() { return !!getToken(); }

        function logout() {
            if (confirm('คุณต้องการออกจากระบบหรือไม่?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            }
        }

        function showAdminOnlyLinks() {
            const navJobs = document.getElementById('nav-jobs');
            const navUsers = document.getElementById('nav-users');
            const navAdminHeader = document.getElementById('nav-admin-header');
            const navCategories = document.getElementById('nav-categories');
            if (navJobs) navJobs.style.display = '';
            if (navUsers) navUsers.style.display = '';
            if (navAdminHeader) navAdminHeader.style.display = '';
            if (navCategories) navCategories.style.display = '';
        }

        async function loadUserInfo() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!response.ok) throw new Error('Unauthorized');
                const user = await response.json();
                document.getElementById('userDisplay').textContent = user.username;
                document.getElementById('userInitial').textContent = user.username.charAt(0).toUpperCase();

                const roleEl = document.getElementById('userRole');
                if (roleEl) {
                    roleEl.textContent = user.role === 'admin' ? 'Admin' : 'User';
                    roleEl.style.opacity = '1';
                }

                if (user.role === 'admin') {
                    showAdminOnlyLinks();
                } else {
                    // Non-admin — redirect
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
                logout();
            }
        }

        // ========================
        // CATEGORIES CRUD
        // ========================
        let categories = [];

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) throw new Error('Failed');
                categories = await res.json();
                renderCategories();
            } catch (e) {
                document.getElementById('categoryList').innerHTML = '<p class="text-red-500 text-center">ไม่สามารถโหลดข้อมูลได้</p>';
            }
        }

        function renderCategories() {
            const list = document.getElementById('categoryList');
            if (categories.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">ยังไม่มีประเภท</p>';
                return;
            }

            list.innerHTML = categories.map(cat => `
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl group hover:bg-indigo-50 transition-colors" id="cat-${cat.id}">
                    <i class="fas fa-tag text-indigo-400"></i>
                    <span class="flex-1 font-medium text-gray-800 cat-name">${cat.name}</span>
                    <input type="text" class="hidden flex-1 px-3 py-1.5 rounded-lg border text-sm cat-edit-input" value="${cat.name}">
                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="startEdit(${cat.id})" class="text-indigo-500 hover:text-indigo-700 text-sm cat-edit-btn"><i class="fas fa-edit"></i></button>
                        <button onclick="saveEdit(${cat.id})" class="hidden text-green-600 hover:text-green-700 text-sm cat-save-btn"><i class="fas fa-check"></i></button>
                        <button onclick="cancelEdit(${cat.id})" class="hidden text-gray-400 hover:text-gray-600 text-sm cat-cancel-btn"><i class="fas fa-times"></i></button>
                        <button onclick="deleteCategory(${cat.id}, '${cat.name}')" class="text-red-400 hover:text-red-600 text-sm"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function addCategory() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            if (!name) { Toast.show('กรุณาใส่ชื่อประเภท', 'warning'); return; }
            try {
                const res = await fetch(`${API_BASE}/categories?name=${encodeURIComponent(name)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                Toast.show(`เพิ่มประเภท "${name}" สำเร็จ`, 'success');
                input.value = '';
                loadCategories();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        function startEdit(id) {
            const row = document.getElementById(`cat-${id}`);
            row.querySelector('.cat-name').classList.add('hidden');
            row.querySelector('.cat-edit-input').classList.remove('hidden');
            row.querySelector('.cat-edit-btn').classList.add('hidden');
            row.querySelector('.cat-save-btn').classList.remove('hidden');
            row.querySelector('.cat-cancel-btn').classList.remove('hidden');
            row.querySelector('.cat-edit-input').focus();
        }

        function cancelEdit(id) {
            const row = document.getElementById(`cat-${id}`);
            row.querySelector('.cat-name').classList.remove('hidden');
            row.querySelector('.cat-edit-input').classList.add('hidden');
            row.querySelector('.cat-edit-btn').classList.remove('hidden');
            row.querySelector('.cat-save-btn').classList.add('hidden');
            row.querySelector('.cat-cancel-btn').classList.add('hidden');
        }

        async function saveEdit(id) {
            const row = document.getElementById(`cat-${id}`);
            const name = row.querySelector('.cat-edit-input').value.trim();
            if (!name) { Toast.show('ชื่อห้ามว่าง', 'warning'); return; }
            try {
                const res = await fetch(`${API_BASE}/categories/${id}?name=${encodeURIComponent(name)}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                Toast.show('แก้ไขสำเร็จ', 'success');
                loadCategories();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        async function deleteCategory(id, name) {
            if (!confirm(`ลบประเภท "${name}"? โพสต์ที่อยู่ในประเภทนี้จะถูกตั้งเป็นไม่ระบุ`)) return;
            try {
                const res = await fetch(`${API_BASE}/categories/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Failed'); }
                Toast.show(`ลบประเภท "${name}" แล้ว`, 'success');
                loadCategories();
            } catch (e) { Toast.show('Error: ' + e.message, 'error'); }
        }

        // Enter key to add
        document.getElementById('newCategoryName').addEventListener('keydown', e => {
            if (e.key === 'Enter') addCategory();
        });

        // ========================
        // INIT
        // ========================
        async function checkAuth() {
            if (!isLoggedIn()) {
                window.location.href = 'index.html';
            } else {
                await loadUserInfo();
                loadCategories();
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>

</html>
